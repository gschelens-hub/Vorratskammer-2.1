<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>🥫 Vorratskammer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: #0e0a04;
    background-image: radial-gradient(ellipse at 20% 0%, #1f1200 0%, transparent 60%),
                      radial-gradient(ellipse at 80% 100%, #0a1a0a 0%, transparent 60%);
    min-height: 100vh; color: #f0e6c8;
    -webkit-tap-highlight-color: transparent;
  }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: #0e0a04; }
  ::-webkit-scrollbar-thumb { background: #5a4a2a; border-radius: 4px; }
  input[type=date]::-webkit-calendar-picker-indicator { filter: invert(0.6); }
  select option { background: #1c1508; color: #f0e6c8; }

  header { display:flex; justify-content:space-between; align-items:center; padding:16px 16px 12px; border-bottom:1px solid #2a1f0a; position:sticky; top:0; background:#0e0a04; z-index:10; }
  .header-left { display:flex; align-items:center; gap:10px; }
  .header-left h1 { font-family:'DM Serif Display',serif; font-size:22px; color:#f0e6c8; line-height:1; }
  .header-left p { font-size:11px; color:#a0926e; }
  .header-btns { display:flex; gap:10px; }

  .btn-hdr-history { background:#1c1508; border:1.5px solid #3a2800; border-radius:12px; width:48px; height:48px; font-size:22px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .btn-hdr-consume { background:#3f0000; border:1.5px solid #991b1b; border-radius:12px; width:48px; height:48px; font-size:22px; cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px rgba(239,68,68,0.3); }
  .btn-hdr-add { background:#052e16; border:1.5px solid #166534; border-radius:12px; width:48px; height:48px; font-size:22px; cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px rgba(74,222,128,0.2); }

  #alert-bar { display:none; gap:16px; padding:8px 16px; background:#1a0f00; border-bottom:1px solid #3a2500; font-size:13px; }
  #alert-bar.visible { display:flex; }

  .search-wrap { padding:10px 16px 6px; }
  .filter-row { display:flex; gap:6px; padding:6px 16px; overflow-x:auto; padding-bottom:4px; }
  .filter-row.wrap { flex-wrap:wrap; }

  input, select { background:#0e0a04; border:1px solid #3a2800; border-radius:8px; padding:10px 12px; color:#f0e6c8; font-size:14px; outline:none; width:100%; font-family:'DM Sans',sans-serif; }
  input::placeholder { color:#5a4a2a; }
  label.field-label { display:block; font-size:11px; color:#a0926e; margin-bottom:4px; letter-spacing:0.05em; text-transform:uppercase; }

  .btn-primary { background:#b45309; border:none; border-radius:8px; padding:10px 16px; color:#fff8e7; font-weight:600; font-size:14px; cursor:pointer; font-family:'DM Sans',sans-serif; white-space:nowrap; }
  .btn-chip { background:#1c1508; border:1px solid #3a2800; border-radius:20px; padding:5px 12px; color:#a0926e; font-size:12px; cursor:pointer; white-space:nowrap; flex-shrink:0; font-family:'DM Sans',sans-serif; }
  .btn-chip.active { background:#3a2500; border-color:#b45309; color:#f0e6c8; }
  .btn-icon { background:transparent; border:none; font-size:16px; cursor:pointer; padding:4px 6px; opacity:0.8; }
  .btn-minus { background:#3f0000; border:1px solid #991b1b; border-radius:6px; color:#f87171; font-size:13px; font-weight:700; cursor:pointer; padding:4px 9px; font-family:'DM Sans',sans-serif; flex-shrink:0; }
  .btn-scan { background:#1c1508; border:1px solid #3a2800; border-radius:8px; padding:10px 14px; font-size:18px; cursor:pointer; flex-shrink:0; }
  .btn-close { background:transparent; border:none; color:#a0926e; font-size:20px; cursor:pointer; padding:4px 8px; }
  .btn-danger { background:#7f1d1d; border:none; border-radius:8px; padding:10px 18px; color:#fca5a5; font-weight:600; font-size:14px; cursor:pointer; font-family:'DM Sans',sans-serif; }

  #item-list { padding:8px 16px 100px; display:flex; flex-direction:column; gap:10px; }
  .item-card { border-radius:12px; border:1px solid; padding:12px 14px; cursor:pointer; transition:filter 0.15s; }
  .item-card:active { filter:brightness(1.2); }
  .item-card-inner { display:flex; align-items:flex-start; gap:10px; }
  .status-dot { width:10px; height:10px; border-radius:50%; margin-top:6px; flex-shrink:0; }
  .item-name { font-family:'DM Serif Display',serif; font-size:16px; color:#f0e6c8; margin-bottom:2px; }
  .item-meta { font-size:12px; color:#a0926e; }
  .item-row { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .item-actions { display:flex; gap:4px; flex-shrink:0; align-items:center; }
  .item-tags { display:flex; gap:8px; margin-top:6px; flex-wrap:wrap; align-items:center; }
  .tag { background:#0e0a04; border-radius:4px; padding:2px 6px; font-size:11px; color:#a0926e; border:1px solid #2a1f0a; }

  .empty-state { text-align:center; padding:60px 20px; color:#a0926e; }
  .empty-state .big-icon { font-size:48px; margin-bottom:12px; }
  .empty-state h2 { font-family:'DM Serif Display',serif; font-size:18px; color:#f0e6c8; margin-bottom:8px; }

  .overlay { position:fixed; inset:0; background:rgba(0,0,0,0.75); backdrop-filter:blur(4px); z-index:100; display:flex; align-items:center; justify-content:center; padding:16px; }
  .overlay.hidden { display:none; }
  .modal { background:#1c1508; border:1px solid #3a2800; border-radius:16px; padding:20px; width:100%; max-width:420px; box-shadow:0 20px 60px rgba(0,0,0,0.6); max-height:90vh; overflow-y:auto; }
  .modal-title { font-family:'DM Serif Display',serif; font-size:20px; color:#f0e6c8; }
  .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
  .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .field { margin-bottom:14px; }
  .barcode-row { display:flex; gap:8px; margin-bottom:14px; }
  .barcode-row input { flex:1; }

  .section-title { font-size:11px; color:#a0926e; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:8px; margin-top:16px; }
  .exp-stack { display:flex; flex-direction:column; gap:8px; margin:8px 0; }
  .exp-row { display:flex; align-items:center; justify-content:space-between; background:#0e0a04; border:1px solid #2a1f0a; border-radius:8px; padding:10px 12px; }
  .exp-row-left { display:flex; align-items:center; gap:8px; }
  .exp-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .exp-label { font-size:14px; color:#f0e6c8; }
  .exp-sublabel { font-size:11px; margin-top:2px; }
  .exp-remove { background:transparent; border:none; color:#a0926e; font-size:16px; cursor:pointer; padding:2px 6px; }
  .add-exp-row { display:flex; gap:8px; margin-top:8px; align-items:center; }
  .add-exp-row input[type=date] { flex:1; }
  .add-exp-row input[type=number] { width:75px; }
  .detail-actions { display:flex; gap:8px; margin-top:16px; }
  .btn-consume-detail { background:#3f0000; border:1px solid #991b1b; border-radius:8px; padding:10px; color:#f87171; font-weight:600; font-size:13px; cursor:pointer; font-family:'DM Sans',sans-serif; flex:1; }


  .hist-row { display:flex; align-items:flex-start; gap:10px; background:#0e0a04; border:1px solid #2a1f0a; border-radius:8px; padding:10px 12px; }
  .hist-icon { font-size:18px; flex-shrink:0; margin-top:1px; }
  .hist-name { font-size:14px; color:#f0e6c8; }
  .hist-detail { font-size:11px; color:#a0926e; margin-top:2px; }


  .fill-bar { display:flex; gap:3px; margin-top:6px; align-items:center; }
  .fill-seg { height:6px; flex:1; border-radius:3px; background:#2a1f0a; transition:background 0.2s; }
  .fill-seg.active-full { background:#4ade80; }
  .fill-seg.active-half { background:#facc15; }
  .fill-seg.active-low  { background:#fb923c; }
  .fill-seg.active-empty { background:#f87171; }
  .fill-label { font-size:11px; margin-left:6px; white-space:nowrap; }
  .fill-btns { display:flex; gap:6px; margin-top:8px; }
  .fill-btn { flex:1; border:1px solid #3a2800; border-radius:8px; padding:8px 4px; font-size:12px; font-weight:600; cursor:pointer; background:#0e0a04; color:#a0926e; font-family:"DM Sans",sans-serif; text-align:center; }
  .fill-btn.selected { border-color:#b45309; color:#f0e6c8; background:#1c1508; }

  #toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(20px); background:#1c3a1c; border:1px solid #166534; color:#4ade80; padding:10px 20px; border-radius:20px; font-size:14px; font-weight:600; opacity:0; transition:all 0.3s ease; z-index:300; white-space:nowrap; pointer-events:none; }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  #toast.error { background:#3f0000; border-color:#991b1b; color:#f87171; }

  #scanner-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index:200; display:flex; flex-direction:column; }
  #scanner-overlay.hidden { display:none; }
  #scanner-header { display:flex; justify-content:space-between; align-items:flex-start; padding:16px; }
  #scanner-title { font-family:'DM Serif Display',serif; font-size:20px; color:#f0e6c8; display:block; }
  #scanner-mode-label { font-size:12px; color:#f87171; margin-top:2px; display:block; }
  #video-wrap { position:relative; flex:1; overflow:hidden; }
  #scanner-video { width:100%; height:100%; object-fit:cover; display:block; }
  .scan-frame { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:70%; height:80px; border:2px solid rgba(250,204,21,0.9); border-radius:8px; box-shadow:0 0 0 2000px rgba(0,0,0,0.5); pointer-events:none; }
  .scan-line { position:absolute; top:0; left:0; right:0; height:2px; background:rgba(250,204,21,0.8); animation:scanline 2s linear infinite; }
  @keyframes scanline { 0%{top:0} 100%{top:calc(100% - 2px)} }
  #scanner-status { padding:16px; text-align:center; color:#a0926e; font-size:14px; }
  #scanner-manual { padding:0 16px 24px; display:flex; gap:8px; }
  #scanner-manual input { flex:1; }
</style>
</head>
<body>

<div id="scanner-overlay" class="hidden">
  <div id="scanner-header">
    <div>
      <span id="scanner-title">📷 Barcode scannen</span>
      <span id="scanner-mode-label"></span>
    </div>
    <button class="btn-close" onclick="closeScanner()">✕</button>
  </div>
  <div id="video-wrap">
    <video id="scanner-video" muted playsinline autoplay></video>
    <div class="scan-frame"><div class="scan-line"></div></div>
  </div>
  <div id="scanner-status">Kamera wird gestartet…</div>
  <div id="scanner-manual">
    <input type="text" id="manual-input" placeholder="Oder Barcode manuell eingeben…" inputmode="numeric">
    <button class="btn-primary" onclick="manualBarcode()">OK</button>
  </div>
</div>

<div id="toast"></div>

<header>
  <div class="header-left">
    <span style="font-size:26px">🥫</span>
    <div>
      <h1>Vorratskammer</h1>
      <p id="item-count">0 Produkte</p>
    </div>
  </div>
  <div class="header-btns">
    <button class="btn-hdr-history" onclick="openHistory()" title="Historie">📋</button>
    <button class="btn-hdr-consume" onclick="openConsumeScanner()" title="Verbrauch buchen">📤</button>
    <button class="btn-hdr-add" onclick="openAddModal()" title="Produkt hinzufügen">📥</button>
  </div>
</header>

<div id="alert-bar">
  <span id="alert-expired" style="color:#f87171"></span>
  <span id="alert-warn" style="color:#facc15"></span>
</div>

<div class="search-wrap">
  <input type="search" id="search-input" placeholder="🔍 Produkt suchen…" oninput="render()">
</div>

<div class="filter-row" id="status-filters">
  <button class="btn-chip active" onclick="setFilter('status','all',this)">Alle</button>
  <button class="btn-chip" onclick="setFilter('status','warn',this)">🟡 Bald ablaufend</button>
  <button class="btn-chip" onclick="setFilter('status','expired',this)">🔴 Abgelaufen</button>
</div>
<div class="filter-row wrap" id="cat-filters">
  <button class="btn-chip active" onclick="setFilter('cat','all',this)">Alle Kat.</button>
</div>
<div class="filter-row wrap" id="loc-filters">
  <button class="btn-chip active" onclick="setFilter('loc','all',this)">Alle Orte</button>
</div>

<div id="item-list"></div>

<!-- Add/Edit Modal -->
<div class="overlay hidden" id="item-modal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modal-title">📥 Produkt hinzufügen</span>
      <button class="btn-close" onclick="closeModal()">✕</button>
    </div>
    <div class="barcode-row">
      <input type="text" id="f-barcode" placeholder="Barcode (optional)" inputmode="numeric" onblur="if(this.value) fetchProduct(this.value)">
      <button class="btn-scan" onclick="openAddScanner()">📷</button>
    </div>
    <div id="fetch-status" style="display:none;color:#a0926e;font-size:13px;margin-bottom:10px;">⏳ Produktdaten werden geladen…</div>
    <div class="field"><input type="text" id="f-name" placeholder="Produktname *"></div>
    <div class="grid-2 field">
      <div><label class="field-label">Kategorie</label><select id="f-category"></select></div>
      <div><label class="field-label">Lagerort</label><select id="f-location"></select></div>
    </div>
    <div class="field"><label class="field-label">Ablaufdatum (optional)</label><input type="date" id="f-expires"></div>
    <button class="btn-primary" onclick="saveItem()" style="width:100%">Speichern</button>
    <button class="btn-danger" id="delete-btn" onclick="deleteCurrentItem()" style="width:100%;margin-top:10px;display:none">🗑️ Löschen</button>
  </div>
</div>

<!-- Detail Modal -->
<div class="overlay hidden" id="detail-modal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="detail-name"></span>
      <button class="btn-close" onclick="closeDetail()">✕</button>
    </div>
    <div id="detail-meta" style="font-size:12px;color:#a0926e;margin-bottom:2px;"></div>
    <div id="detail-barcode" style="font-size:12px;color:#a0926e;margin-bottom:2px;"></div>
    <div id="detail-addedat" style="font-size:12px;color:#a0926e;margin-bottom:2px;"></div>
    <div id="detail-ofwlink" style="font-size:12px;margin-bottom:4px;"></div>

    <div class="section-title" style="margin-top:12px;">Füllstand</div>
    <div class="fill-btns" id="fill-btns">
      <button class="fill-btn" onclick="setFill('full')" data-fill="full">🟢 Voll</button>
      <button class="fill-btn" onclick="setFill('half')" data-fill="half">🟡 Halb</button>
      <button class="fill-btn" onclick="setFill('low')" data-fill="low">🟠 Fast leer</button>
      <button class="fill-btn" onclick="setFill('empty')" data-fill="empty">🔴 Leer</button>
    </div>
    <div class="section-title" style="margin-top:12px;">Ablaufdaten — ältestes zuerst</div>
    <div class="exp-stack" id="exp-stack"></div>

    <div class="section-title">Neues Ablaufdatum hinzufügen</div>
    <div class="add-exp-row">
      <input type="date" id="new-exp-date">
      <input type="number" id="new-exp-qty" placeholder="Menge" min="1" value="1">
      <button class="btn-primary" onclick="addExpDate()" style="padding:10px 14px;flex-shrink:0;">＋</button>
    </div>

    <div class="detail-actions">
      <button class="btn-primary" onclick="openEditFromDetail()" style="flex:1;">✏️ Bearbeiten</button>
      <button class="btn-consume-detail" onclick="consumeOneFromDetail()">📤 −1</button>
    </div>
  </div>
</div>


<!-- History Modal -->
<div class="overlay hidden" id="history-modal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">📋 Letzte Aktionen</span>
      <button class="btn-close" onclick="closeHistory()">✕</button>
    </div>
    <div id="history-list" style="display:flex;flex-direction:column;gap:8px;margin-top:4px;"></div>
    <button class="btn-danger" onclick="clearHistory()" style="width:100%;margin-top:16px;">🗑️ Historie löschen</button>
  </div>
</div>

<script>
const KEY = "pantry_v3";
const HKEY = "pantry_history_v1";
let history = [];
try { history = JSON.parse(localStorage.getItem(HKEY)) || []; } catch(e) { history=[]; }
let items = [];
try {
  const old2 = localStorage.getItem("pantry_items_v2");
  if (old2) {
    items = JSON.parse(old2).map(function(i) {
      return { id:i.id, name:i.name, barcode:i.barcode||"", category:i.category, location:i.location,
        expiryStack: i.expires ? [{date:i.expires, qty:i.qty||1}] : [] };
    });
    localStorage.setItem(KEY, JSON.stringify(items));
  } else {
    items = JSON.parse(localStorage.getItem(KEY)) || [];
  }
} catch(e) { items=[]; }

const CATS = ["🥛 Milchprodukte","🥩 Fleisch & Fisch","🥦 Gemüse & Obst","🥫 Konserven","🍞 Brot & Backwaren","🧂 Gewürze","🧃 Getränke","🍫 Süßes","🍝 Nudeln & Reis","❓ Sonstiges"];
const LOCS = ["❄️ Kühlschrank","🧊 Tiefkühler","🪣 Vorratsschrank","🗄️ Keller","🍽️ Küche offen"];
const SC = { ok:{dot:"#4ade80",bg:"#052e16",border:"#166534"}, warn:{dot:"#facc15",bg:"#1c1400",border:"#854d0e"}, expired:{dot:"#f87171",bg:"#1f0000",border:"#991b1b"} };

let filters={status:"all",cat:"all",loc:"all"}, editId=null, detailId=null, scanMode="add";
let camStream=null, det=null, scanOn=false, rafId=null;

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);
const save=()=>localStorage.setItem(KEY,JSON.stringify(items));
const today=()=>new Date().toISOString().split("T")[0];
const dLeft=(e)=>e?Math.ceil((new Date(e)-new Date(today()))/86400000):null;
const stat=(e)=>{const d=dLeft(e);if(d===null)return"ok";if(d<0)return"expired";if(d<=7)return"warn";return"ok";};
const totalQty=(item)=>(!item.expiryStack||!item.expiryStack.length)?0:item.expiryStack.reduce(function(s,e){return s+(e.qty||1);},0);
const nextExp=(item)=>{if(!item.expiryStack||!item.expiryStack.length)return null;return item.expiryStack.slice().sort(function(a,b){return a.date>b.date?1:-1;})[0].date;};
const worstStat=(item)=>{if(!item.expiryStack||!item.expiryStack.length)return"ok";const ss=item.expiryStack.map(function(e){return stat(e.date);});if(ss.includes("expired"))return"expired";if(ss.includes("warn"))return"warn";return"ok";};
const fmtDate=(d)=>{if(!d)return"";const p=d.split("-");return p[2]+"."+p[1]+"."+p[0];};
const esc=(s)=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

let toastT=null;
function toast(msg,err){const t=document.getElementById("toast");t.textContent=msg;t.className="show"+(err?" error":"");clearTimeout(toastT);toastT=setTimeout(function(){t.className="";},2500);}

function init(){
  const cs=document.getElementById("f-category"),ls=document.getElementById("f-location");
  CATS.forEach(function(c){cs.innerHTML+="<option>"+c+"</option>";});
  LOCS.forEach(function(l){ls.innerHTML+="<option>"+l+"</option>";});
  const cf=document.getElementById("cat-filters"),lf=document.getElementById("loc-filters");
  CATS.forEach(function(c){const b=document.createElement("button");b.className="btn-chip";b.textContent=c.split(" ")[0];b.onclick=function(){setFilter("cat",c,b);};cf.appendChild(b);});
  LOCS.forEach(function(l){const b=document.createElement("button");b.className="btn-chip";b.textContent=l.split(" ")[0];b.onclick=function(){setFilter("loc",l,b);};lf.appendChild(b);});
  render();
}

function render(){
  const q=document.getElementById("search-input").value.toLowerCase();
  const vis=items.filter(function(i){
    const ws=worstStat(i);
    if(filters.status==="warn")return ws==="warn";
    if(filters.status==="expired")return ws==="expired";
    return true;
  }).filter(function(i){return filters.cat==="all"||i.category===filters.cat;})
  .filter(function(i){return filters.loc==="all"||i.location===filters.loc;})
  .filter(function(i){return!q||i.name.toLowerCase().includes(q);})
  .sort(function(a,b){const o={expired:0,warn:1,ok:2};return(o[worstStat(a)]||3)-(o[worstStat(b)]||3);});

  const list=document.getElementById("item-list");
  if(!vis.length){
    list.innerHTML='<div class="empty-state"><div class="big-icon">📦</div><h2>Keine Produkte gefunden</h2><p>Tippe auf 📥 um loszulegen!</p></div>';
  } else {
    list.innerHTML=vis.map(function(item){
      const s=worstStat(item),c=SC[s],next=nextExp(item),d=dLeft(next),qty=totalQty(item),cnt=item.expiryStack?item.expiryStack.length:0;
      let el="";
      if(next){if(s==="expired")el="⚠️ vor "+Math.abs(d)+" Tagen abgelaufen";else if(s==="warn")el="⚠️ noch "+d+" Tag"+(d===1?"":"e");else el="✓ noch "+d+" Tag"+(d===1?"":"e");}
      return'<div class="item-card" style="background:'+c.bg+';border-color:'+c.border+'" onclick="openDetail(\''+item.id+'\')">'
        +'<div class="item-card-inner">'
        +'<div class="status-dot" style="background:'+c.dot+';box-shadow:0 0 6px '+c.dot+'"></div>'
        +'<div style="flex:1;min-width:0">'
        +'<div class="item-row">'
        +'<div style="flex:1;min-width:0"><div class="item-name">'+esc(item.name)+'</div><div class="item-meta">'+esc(item.category)+' · '+esc(item.location)+'</div></div>'
        +'<div class="item-actions">'
        +'<button class="btn-minus" onclick="event.stopPropagation();consumeOne(\''+item.id+'\')">−1</button>'
        +'<button class="btn-icon" onclick="event.stopPropagation();openEditModal(\''+item.id+'\')">✏️</button>'
        +'<button class="btn-icon" onclick="event.stopPropagation();deleteItem(\''+item.id+'\')">🗑️</button>'
        +'</div></div>'
        +'<div class="item-tags">'
        +(item.barcode?'<span class="tag">#'+esc(item.barcode)+'</span>':"")
        +'<span class="tag">Gesamt: <strong style="color:#f0e6c8">'+qty+'</strong></span>'
        +(cnt>1?'<span class="tag">'+cnt+' Daten 👆</span>':"")
        +(el?'<span class="tag" style="color:'+c.dot+'">'+el+'</span>':"")
        +'</div></div></div></div>';
    }).join("");
  }
  document.getElementById("item-count").textContent=items.length+" Produkte";
  const exp=items.filter(function(i){return worstStat(i)==="expired";}).length;
  const wrn=items.filter(function(i){return worstStat(i)==="warn";}).length;
  const bar=document.getElementById("alert-bar");
  bar.classList.toggle("visible",exp>0||wrn>0);
  document.getElementById("alert-expired").textContent=exp>0?"🔴 "+exp+" abgelaufen":"";
  document.getElementById("alert-warn").textContent=wrn>0?"🟡 "+wrn+" laufen bald ab":"";
}

function setFilter(type,val,btn){
  filters[type]=val;
  const gid={status:"status-filters",cat:"cat-filters",loc:"loc-filters"}[type];
  document.getElementById(gid).querySelectorAll(".btn-chip").forEach(function(b){b.classList.remove("active");});
  btn.classList.add("active");render();
}

function openDetail(id){
  const item=items.find(function(i){return i.id===id;});
  if(!item)return;
  detailId=id;
  document.getElementById("detail-name").textContent=item.name;
  document.getElementById("detail-meta").textContent=item.category+" · "+item.location;
  document.getElementById("detail-barcode").textContent=item.barcode?"Barcode: "+item.barcode:"";
  document.getElementById("detail-addedat").textContent=item.addedAt?"Hinzugefügt: "+fmtTs(item.addedAt):"";
  const ofwEl=document.getElementById("detail-ofwlink");
  if(item.barcode)ofwEl.innerHTML='<a href="https://world.openfoodfacts.org/product/'+item.barcode+'" target="_blank" style="color:#b45309;text-decoration:none;">🔗 Produktinfos auf OpenFoodFacts ↗</a>';
  else ofwEl.innerHTML="";
  document.getElementById("new-exp-date").value="";
  document.getElementById("new-exp-qty").value=1;
  renderExpStack(item);
  renderFillBtns(item.fill || null);
  document.getElementById("detail-modal").classList.remove("hidden");
}

function renderExpStack(item){
  const el=document.getElementById("exp-stack");
  if(!item.expiryStack||!item.expiryStack.length){
    el.innerHTML='<div style="color:#a0926e;font-size:13px;text-align:center;padding:12px 0;">Keine Ablaufdaten eingetragen</div>';return;
  }
  const sorted=item.expiryStack.slice().sort(function(a,b){return a.date>b.date?1:-1;});
  el.innerHTML=sorted.map(function(e,i){
    const s=stat(e.date),c=SC[s],d=dLeft(e.date);
    let lbl=s==="expired"?"vor "+Math.abs(d)+" Tagen abgelaufen":s==="warn"?"noch "+d+" Tag"+(d===1?"":"e"):"noch "+d+" Tag"+(d===1?"":"e");
    return'<div class="exp-row">'
      +'<div class="exp-row-left"><div class="exp-dot" style="background:'+c.dot+';box-shadow:0 0 4px '+c.dot+'"></div>'
      +'<div><div class="exp-label">'+fmtDate(e.date)+' · '+(e.qty||1)+'x</div>'
      +'<div class="exp-sublabel" style="color:'+c.dot+'">'+lbl+'</div></div></div>'
      +'<button class="exp-remove" onclick="removeExp(\''+item.id+'\','+i+')">✕</button></div>';
  }).join("");
}

function addExpDate(){
  const item=items.find(function(i){return i.id===detailId;});
  if(!item)return;
  const date=document.getElementById("new-exp-date").value;
  const qty=parseInt(document.getElementById("new-exp-qty").value)||1;
  if(!date){toast("Bitte Datum auswählen",true);return;}
  if(!item.expiryStack)item.expiryStack=[];
  const ex=item.expiryStack.find(function(e){return e.date===date;});
  if(ex)ex.qty=(ex.qty||1)+qty;
  else item.expiryStack.push({date:date,qty:qty});
  save();renderExpStack(item);render();
  document.getElementById("new-exp-date").value="";
  document.getElementById("new-exp-qty").value=1;
  toast("✓ Ablaufdatum hinzugefügt");
  logAction("expiry",item.name,"MHD: "+fmtDate(date)+" x"+qty);
}

function removeExp(id,sortedIdx){
  const item=items.find(function(i){return i.id===id;});
  if(!item)return;
  const sorted=item.expiryStack.slice().sort(function(a,b){return a.date>b.date?1:-1;});
  const toRm=sorted[sortedIdx];
  item.expiryStack=item.expiryStack.filter(function(e){return!(e.date===toRm.date&&e.qty===toRm.qty);});
  save();renderExpStack(item);render();
}

function consumeOneFromDetail(){
  if(!detailId)return;
  consumeOne(detailId);
  const item=items.find(function(i){return i.id===detailId;});
  if(item)renderExpStack(item);else closeDetail();
}

function closeDetail(){document.getElementById("detail-modal").classList.add("hidden");detailId=null;}

function openEditFromDetail(){
  const id=detailId;closeDetail();openEditModal(id);
}

function consumeOne(id){
  const item=items.find(function(i){return i.id===id;});
  if(!item)return;
  if(!item.expiryStack||!item.expiryStack.length){toast("⚠️ Keine Ablaufdaten vorhanden",true);return;}
  item.expiryStack.sort(function(a,b){return a.date>b.date?1:-1;});
  const first=item.expiryStack[0];
  if((first.qty||1)>1){
    first.qty=(first.qty||1)-1;save();render();
    toast("✓ "+item.name+" – "+fmtDate(first.date)+" noch "+first.qty+"x");
    logAction("consume",item.name,fmtDate(first.date)+" noch "+first.qty+"x");
  } else {
    item.expiryStack.shift();
    if(!item.expiryStack.length){
      if(confirm('"'+item.name+'" ist aufgebraucht. Eintrag löschen?')){
        items=items.filter(function(i){return i.id!==id;});save();render();toast("🗑️ "+item.name+" entfernt");logAction("delete",item.name,"");logAction("delete",item.name,"aufgebraucht");return;
      }
    }
    save();render();toast("✓ "+item.name+" – "+fmtDate(first.date)+" verbraucht");
    logAction("consume",item.name,fmtDate(first.date)+" verbraucht");
  }
}

function openConsumeScanner(){
  scanMode="consume";
  document.getElementById("scanner-title").textContent="📤 Verbrauch scannen";
  document.getElementById("scanner-mode-label").textContent="Bestand wird um 1 reduziert (FIFO)";
  openScanner();
}
function openAddScanner(){
  scanMode="add";
  document.getElementById("scanner-title").textContent="📷 Barcode scannen";
  document.getElementById("scanner-mode-label").textContent="";
  openScanner();
}


const FILL_LABELS = { full:"Voll", half:"Halbvoll", low:"Fast leer", empty:"Leer – Nachkaufen!" };
const FILL_COLORS = { full:"active-full", half:"active-half", low:"active-low", empty:"active-empty" };
const FILL_SEGS   = { full:4, half:2, low:1, empty:0 };

function setFill(level) {
  const item = items.find(function(i){ return i.id === detailId; });
  if(!item) return;
  item.fill = level;
  save();
  renderFillBtns(level);
  render();
  toast("Füllstand: " + FILL_LABELS[level]);
}

function renderFillBtns(level) {
  document.querySelectorAll(".fill-btn").forEach(function(b){
    b.classList.toggle("selected", b.dataset.fill === level);
  });
}

function fillBarHtml(fill) {
  if(!fill) return "";
  const segs = FILL_SEGS[fill];
  const cls  = FILL_COLORS[fill];
  let html = '<div class="fill-bar">';
  for(let i=0;i<4;i++) html += '<div class="fill-seg'+(i < segs ? " "+cls : "")+'"></div>';
  html += '<span class="fill-label" style="color:'
    + (fill==="full"?"#4ade80":fill==="half"?"#facc15":fill==="low"?"#fb923c":"#f87171")
    + '">'+FILL_LABELS[fill]+'</span></div>';
  return html;
}

function logAction(type, name, detail) {
  const entry = {
    type: type, // "add","consume","delete","expiry"
    name: name,
    detail: detail || "",
    ts: new Date().toISOString()
  };
  history.unshift(entry);
  if(history.length > 50) history = history.slice(0, 50);
  localStorage.setItem(HKEY, JSON.stringify(history));
}

function fmtTs(ts) {
  const d = new Date(ts);
  const pad = function(n){return String(n).padStart(2,"0");};
  return pad(d.getDate())+"."+pad(d.getMonth()+1)+"."+d.getFullYear()+" "+pad(d.getHours())+":"+pad(d.getMinutes());
}

function openHistory() {
  const el = document.getElementById("history-list");
  if(!history.length) {
    el.innerHTML = '<div style="color:#a0926e;text-align:center;padding:20px;">Noch keine Aktionen</div>';
  } else {
    const icons = {add:"📥",consume:"📤",delete:"🗑️",expiry:"📅"};
    el.innerHTML = history.map(function(h) {
      return '<div class="hist-row">'
        +'<div class="hist-icon">'+(icons[h.type]||"•")+'</div>'
        +'<div><div class="hist-name">'+esc(h.name)+'</div>'
        +'<div class="hist-detail">'+esc(h.detail)+(h.detail?" · ":"")+ fmtTs(h.ts)+'</div></div>'
        +'</div>';
    }).join("");
  }
  document.getElementById("history-modal").classList.remove("hidden");
}

function closeHistory() { document.getElementById("history-modal").classList.add("hidden"); }
function clearHistory() { history=[]; localStorage.removeItem(HKEY); openHistory(); toast("Historie gelöscht"); }

function handleCode(code){
  if(scanMode==="consume"){
    const item=items.find(function(i){return i.barcode===code;});
    if(item)consumeOne(item.id);else toast("⚠️ Produkt nicht gefunden",true);
  } else {
    const existing=items.find(function(i){return i.barcode===code;});
    if(existing){
      openDetail(existing.id);
      toast("✓ "+existing.name+" gefunden – Ablaufdatum eintragen");
    } else {
      document.getElementById("f-barcode").value=code;fetchProduct(code);
    }
  }
}

function openAddModal(){
  editId=null;
  document.getElementById("modal-title").textContent="📥 Produkt hinzufügen";
  document.getElementById("f-barcode").value="";document.getElementById("f-name").value="";
  document.getElementById("f-category").value=CATS[9];document.getElementById("f-location").value=LOCS[0];
  document.getElementById("f-expires").value="";document.getElementById("delete-btn").style.display="none";
  document.getElementById("item-modal").classList.remove("hidden");
}
function openEditModal(id){
  const item=items.find(function(i){return i.id===id;});if(!item)return;
  editId=id;
  document.getElementById("modal-title").textContent="✏️ Bearbeiten";
  document.getElementById("f-barcode").value=item.barcode||"";document.getElementById("f-name").value=item.name;
  document.getElementById("f-category").value=item.category;document.getElementById("f-location").value=item.location;
  document.getElementById("f-expires").value="";document.getElementById("delete-btn").style.display="block";
  document.getElementById("item-modal").classList.remove("hidden");
}
function closeModal(){document.getElementById("item-modal").classList.add("hidden");}
function saveItem(){
  const name=document.getElementById("f-name").value.trim();if(!name){document.getElementById("f-name").focus();return;}
  const expires=document.getElementById("f-expires").value;
  if(editId){
    const idx=items.findIndex(function(i){return i.id===editId;});
    if(idx>=0){
      items[idx].name=name;items[idx].barcode=document.getElementById("f-barcode").value.trim();
      items[idx].category=document.getElementById("f-category").value;items[idx].location=document.getElementById("f-location").value;
      if(expires){if(!items[idx].expiryStack)items[idx].expiryStack=[];
        const ex=items[idx].expiryStack.find(function(e){return e.date===expires;});
        if(ex)ex.qty++;else items[idx].expiryStack.push({date:expires,qty:1});}
    }
  } else {
    const newItem={id:uid(),name:name,barcode:document.getElementById("f-barcode").value.trim(),
      category:document.getElementById("f-category").value,location:document.getElementById("f-location").value,
      addedAt:new Date().toISOString(),
      expiryStack:expires?[{date:expires,qty:1}]:[]};
    items.unshift(newItem);
    logAction("add",name,expires?"MHD: "+fmtDate(expires):"");
  }
  save();closeModal();render();toast("✓ "+name+" gespeichert");
}
function deleteItem(id){
  const item=items.find(function(i){return i.id===id;});
  if(!item||!confirm('"'+item.name+'" löschen?'))return;
  items=items.filter(function(i){return i.id!==id;});save();render();toast("🗑️ "+item.name+" entfernt");logAction("delete",item.name,"");
}
function deleteCurrentItem(){if(!editId)return;closeModal();deleteItem(editId);}

function fetchProduct(code){
  const sel=document.getElementById("fetch-status");sel.style.display="block";
  fetch("https://world.openfoodfacts.org/api/v0/product/"+code+".json")
    .then(function(r){return r.json();})
    .then(function(d){
      if(d.status===1){
        const p=d.product;document.getElementById("f-name").value=p.product_name||p.product_name_de||"";
        document.getElementById("f-barcode").value=code;
        if(p.categories_tags){
          const cats=p.categories_tags.join(" ").toLowerCase();let cat=CATS[9];
          if(cats.includes("milk")||cats.includes("milch")||cats.includes("dairy")||cats.includes("cheese"))cat=CATS[0];
          else if(cats.includes("meat")||cats.includes("fish")||cats.includes("fleisch"))cat=CATS[1];
          else if(cats.includes("vegetable")||cats.includes("fruit")||cats.includes("gemüse"))cat=CATS[2];
          else if(cats.includes("conserve")||cats.includes("canned"))cat=CATS[3];
          else if(cats.includes("bread")||cats.includes("brot")||cats.includes("bakery"))cat=CATS[4];
          else if(cats.includes("beverage")||cats.includes("drink")||cats.includes("getränk"))cat=CATS[6];
          else if(cats.includes("sweet")||cats.includes("chocolate"))cat=CATS[7];
          else if(cats.includes("pasta")||cats.includes("nudel")||cats.includes("rice"))cat=CATS[8];
          document.getElementById("f-category").value=cat;
        }
      } else document.getElementById("f-barcode").value=code;
      sel.style.display="none";
    }).catch(function(){sel.style.display="none";});
}

function openScanner(){document.getElementById("scanner-overlay").classList.remove("hidden");document.getElementById("manual-input").value="";startCam();}
function closeScanner(){
  scanOn=false;cancelAnimationFrame(rafId);
  if(camStream){camStream.getTracks().forEach(function(t){t.stop();});camStream=null;}
  document.getElementById("scanner-overlay").classList.add("hidden");
}
function startCam(){
  const sel=document.getElementById("scanner-status");sel.textContent="Kamera wird gestartet…";
  if(!("BarcodeDetector" in window)){sel.textContent="⚠️ Kein integrierter Scanner. Bitte Barcode manuell eingeben.";return;}
  try{det=new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e","code_128","code_39","qr_code"]});}
  catch(e){sel.textContent="⚠️ Scanner-Fehler. Bitte manuell eingeben.";return;}
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}}})
    .then(function(stream){
      camStream=stream;const v=document.getElementById("scanner-video");v.srcObject=stream;
      v.play().then(function(){sel.textContent="Barcode auf die Kamera halten…";scanOn=true;scanLoop(v);});
    }).catch(function(){sel.textContent="❌ Kamerazugriff verweigert. Bitte manuell eingeben.";});
}
function scanLoop(v){
  if(!scanOn||!det)return;
  det.detect(v).then(function(codes){
    if(!scanOn)return;
    if(codes.length>0){closeScanner();handleCode(codes[0].rawValue);}
    else rafId=requestAnimationFrame(function(){scanLoop(v);});
  }).catch(function(){rafId=requestAnimationFrame(function(){scanLoop(v);});});
}
function manualBarcode(){const val=document.getElementById("manual-input").value.trim();if(!val)return;closeScanner();handleCode(val);}

init();
</script>
</body>
</html>
